{% macro icon(name, class_name='') %}
  <svg class="ui-icon{% if class_name %} {{ class_name }}{% endif %}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    {% if name == 'home' %}<path d="M3 10.8 12 3l9 7.8"></path><path d="M5.5 9.5V21h13V9.5"></path><path d="M9.5 21v-6h5v6"></path>
    {% elif name == 'place' %}<path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"></path><circle cx="12" cy="10" r="2.5"></circle>
    {% elif name == 'school' %}<path d="m3 9 9-5 9 5"></path><path d="M5 10v9h14v-9M3 21h18M9 13h6M9 16h6"></path>
    {% elif name == 'people' %}<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path>
    {% elif name == 'person' %}<circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path>
    {% elif name == 'class' %}<rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M7 8h10M7 12h4M7 16h7"></path>
    {% elif name == 'curriculum' %}<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21.5Z"></path><path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H13v16h4.5a2.5 2.5 0 0 1 2.5 2.5Z"></path>
    {% elif name == 'questions' %}<path d="M9.5 9a2.8 2.8 0 1 1 4.5 2.2c-1.1.8-2 1.3-2 2.8"></path><path d="M12 18h.01"></path><circle cx="12" cy="12" r="9"></circle>
    {% elif name == 'assessment' %}<rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M9 3.5h6v3H9zM8.5 11l2 2 4-4M8.5 17h7"></path>
    {% elif name == 'scanner' %}<path d="M4 7V4h3M17 4h3v3M20 17v3h-3M7 20H4v-3"></path><rect x="7" y="7" width="10" height="10" rx="1"></rect><path d="M9.5 10h5M9.5 12.5h5M9.5 15h3"></path>
    {% elif name == 'chart' %}<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path>
    {% elif name == 'layers' %}<path d="m12 3-9 5 9 5 9-5-9-5Z"></path><path d="m3 12 9 5 9-5M3 16l9 5 9-5"></path>
    {% elif name == 'notification' or name == 'bell' %}<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path><path d="M10 21h4"></path>
    {% elif name == 'chevron-right' %}<path d="m9 18 6-6-6-6"></path>
    {% elif name == 'chevron-left' %}<path d="m15 18-6-6 6-6"></path>
    {% elif name == 'check' %}<path d="m5 12 4 4L19 6"></path>
    {% elif name == 'warning' %}<path d="M12 3 2.8 20h18.4L12 3Z"></path><path d="M12 9v4M12 17h.01"></path>
    {% elif name == 'danger' %}<circle cx="12" cy="12" r="9"></circle><path d="m9 9 6 6M15 9l-6 6"></path>
    {% elif name == 'info' %}<circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path>
    {% elif name == 'empty' %}<path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5v-9Z"></path><path d="m4.5 7.7 7.5 4.2 7.5-4.2M12 12v9"></path>
    {% elif name == 'menu' %}<path d="M4 7h16M4 12h16M4 17h16"></path>
    {% else %}<circle cx="12" cy="12" r="8"></circle>{% endif %}
  </svg>
{% endmacro %}
